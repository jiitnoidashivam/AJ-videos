<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AJ Videos | Edit workspace</title><link rel="stylesheet" href="style.css"></head><body>
<header><strong class="brand"><b>AJ</b> Videos</strong><span class="sep"></span><button id="projectName" title="Rename sequence">Orbital Studies</button><i class="projectType">PROJECT</i><aside></aside><button id="newProj">New</button><button id="open">Open</button><button id="save">Save project</button><button class="primary" id="export">↑ Export</button></header>
<nav><div class="workspace">WORKSPACE</div><button data-tab="Edit" class="active">Edit</button><button data-tab="Color">Color</button><button data-tab="Audio">Audio</button><button data-tab="Graphics">Graphics</button><aside></aside><span class="status"><i></i> Local session</span></nav>
<main><section class="bin"><h3>Project media <small id="count"></small></h3><div class="binbar"><input id="search" placeholder="Search assets" aria-label="Search assets"><button id="import">＋ Import</button></div><div id="assets"></div><div class="binfoot">Click to preview · Double-click to insert</div></section>
<section class="monitor"><h3>Program monitor <aside></aside><small id="aspect">16:9</small></h3><div id="sourcePane" hidden></div><div class="stage"><canvas id="screen" width="960" height="540"></canvas></div><div class="transport"><output id="clock"></output><aside></aside><button id="home" title="Sequence start">|◀</button><button id="prev" title="Previous frame">‹</button><button id="play" title="Play or pause (Space)">▶</button><button id="next" title="Next frame">›</button><aside></aside><select id="ratio" aria-label="Sequence aspect ratio"><option>16:9</option><option>9:16</option><option>1:1</option><option>4:5</option></select></div></section>
<section class="inspector"><h3>Effect controls</h3><div id="props"></div></section>
<section class="timeline"><h3>Timeline <span id="seq"></span><aside></aside><small>30 FPS</small></h3><div class="tools"><button id="split" title="Split (Ctrl+K)">✂ Split</button><button id="del">Delete</button><button id="ripple">Ripple delete</button><button id="undo">↶</button><button id="redo">↷</button><button id="addTitle">＋ Title</button><button id="captions">Import SRT</button><button id="srt">Export SRT</button><aside></aside><label>Zoom <input id="zoom" type="range" min="1" max="8" step=".5" value="1"></label></div><div id="scroll"><div id="lanes"></div></div></section></main><footer><span id="msg" role="status">Ready</span><aside></aside><a href="AJ-Videos.zip" download>Download offline editor ↓</a></footer>
<input hidden type="file" id="files" multiple accept="video/*,audio/*,image/*"><input hidden type="file" id="projectFile" accept=".json,.ajv"><input hidden type="file" id="subtitle" accept=".srt"><input hidden type="file" id="proxy" accept="video/*"><dialog id="dialog"><form method="dialog"><h2>Export sequence</h2><label>Resolution<select id="quality"><option value="720">720p</option><option value="1080">1080p</option><option value="2160">2160p (4K)</option></select></label><label>Format<select id="format"></select></label><p>Exports play in real time. Keep this tab visible until the file downloads.</p><button>Close</button><button type="button" class="primary" id="render">Start export</button></form></dialog>
<script src="art.js"></script><script src="advanced.js"></script><script src="editor.js"></script></body></html>
