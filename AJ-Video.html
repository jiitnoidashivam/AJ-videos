'use strict';
const $=id=>document.getElementById(id),ctx=$('canvas').getContext('2d'),W=1280,H=720,F=30;
const uid=()=>crypto.randomUUID(),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),round=n=>Math.round(n*F)/F;
let project,sel,assetId,t=0,playing=false,tool='select',tab='project',history=[],future=[],last=0,rate=1,ac,bus,rec,exporting=false,dirty=false;
const media=new Map(),visuals=new Map(),presets=['Original','Monochrome','Warm film','Cool tone','High contrast','Soft focus'];
function clip(asset,track,start,duration){return {id:uid(),asset,track,start,duration,offset:0,scale:100,opacity:100,x:0,y:0,brightness:100,saturation:100,volume:100,fade:0,effect:'Original'}}
function demo(){let assets=['Totality','Orbital drift','First light'].map((name,i)=>({id:'scene'+i,name,kind:'scene',duration:6,scene:i}));let clips=assets.map((a,i)=>clip(a.id,'V1',6*i,6));let title=clip(null,'V2',0,4);title.text='E C L I P S E';title.y=32;clips.push(title);return {version:1,name:'Eclipse study',assets,clips,mute:{},markers:[]}}
function asset(c){return project.assets.find(a=>a.id===c.asset)}function chosen(){return project.clips.find(c=>c.id===sel)}function end(){return Math.max(0,...project.clips.map(c=>c.start+c.duration))}function span(){return Math.max(10,Math.ceil((end()+1)/5)*5)}function tc(s){let n=Math.max(0,Math.round(s*F));return [Math.floor(n/108000),Math.floor(n/1800)%60,Math.floor(n/30)%60,n%30].map(v=>String(v).padStart(2,'0')).join(':')}

function scene(i,time){let key=i;if(!visuals.has(key)){let c=document.createElement('canvas');c.width=W;c.height=H;let g=c.getContext('2d'),cx=W*[.51,.40,.64][i],cy=H*[.48,.53,.77][i],r=[133,108,166][i],colors=[['#ffda98','#e7944c','#9c4126','#351a1e','#110e16'],['#dacaff','#a58bdb','#684770','#241e35','#100e1a'],['#ffe9a1','#ffa964','#bb5940','#582a33','#1c1521']][i],grad=g.createRadialGradient(cx,cy,r*.94,cx,cy,560);[0,.026,.10,.42,1].forEach((v,j)=>grad.addColorStop(v,colors[j]));g.fillStyle=grad;g.fillRect(0,0,W,H);let seed=7553+i;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}for(let j=0;j<15000;j++){let a=rand()*Math.PI*2,d=r+Math.pow(rand(),2)*210;g.fillStyle='rgba(255,210,168,'+(1-(d-r)/210)*.055+')';g.fillRect(cx+Math.cos(a)*d,cy+Math.sin(a)*d,1+rand()*3,1)}for(let j=0;j<530;j++){g.globalAlpha=rand()*.5;g.fillStyle='#fff4ec';g.fillRect(rand()*W,rand()*H,1.4,1.4)}g.globalAlpha=1;g.beginPath();g.arc(cx,cy,r,0,7);g.fillStyle='#100d13';g.fill();g.lineWidth=2;g.strokeStyle=colors[0];g.stroke();if(i===1){g.beginPath();g.ellipse(cx,cy,r*1.8,r*.28,-.3,0,7);g.strokeStyle='#baa1cd';g.stroke()}visuals.set(key,c)}return visuals.get(key)}
function audio(){if(!ac){ac=new AudioContext();bus=ac.createMediaStreamDestination()}return ac.resume()}
function element(c,a){if(media.has(c.id))return media.get(c.id);let el=document.createElement(a.kind==='image'?'img':a.kind==='audio'?'audio':'video');el.src=a.data;el.preload='auto';el.playsInline=true;let entry={el};media.set(c.id,entry);el.addEventListener('loadeddata',()=>{if(!playing)draw()});el.addEventListener('seeked',()=>{if(!playing)draw()});el.addEventListener('load',()=>draw());el.onerror=()=>msg('Cannot decode '+a.name);return entry}

function pause(){playing=false;rate=1;$('play').textContent='▶';for(let e of media.values())e.el.pause?.()}
let frameId;function tick(now){if(!playing)return;t+=(now-last)/1000*rate;last=now;if(t>=end()||t<0){t=t<0?0:end();pause();if(exporting&&rec.state==='recording')rec.stop()}draw();if(playing)frameId=requestAnimationFrame(tick)}
async function play(r=1){if(!end())return;await audio();cancelAnimationFrame(frameId);if(t>=end()&&r>0)t=0;rate=r;playing=true;last=performance.now();$('play').textContent='Ⅱ';frameId=requestAnimationFrame(tick)}
function seek(s){if(exporting)return;pause();t=Math.min(end(),Math.max(0,round(s)));draw()}
function library(){let box=$('library');$('mediaTab').classList.toggle('active',tab==='project');$('effectsTab').classList.toggle('active',tab==='effects');if(tab==='effects'){box.innerHTML='<small>Apply to selected clip</small>'+presets.map((v,i)=>'<button class="binitem" data-f="'+i+'">ƒx　'+v+'</button>').join('');box.querySelectorAll('button').forEach(b=>b.onclick=()=>{let c=chosen();if(!c)return msg('Select a timeline clip first');checkpoint();c.effect=presets[b.dataset.f];render()});return}box.innerHTML='<button id="import" class="full">＋ Import media</button><h3>Project items <small>('+project.assets.length+')</small></h3>';for(let a of project.assets){let b=document.createElement('button');b.className='binitem'+(assetId===a.id?' selected':'');b.draggable=true;b.title='Double-click to append, or drag onto a track';let img=document.createElement(a.kind==='scene'||a.kind==='image'?'img':'div');img.className='thumb';if(a.kind==='scene')img.src=thumbnail(a.scene);else if(a.kind==='image')img.src=a.data;else img.textContent=a.kind==='audio'?'♫':'▸';b.append(img);let detail=document.createElement('span');detail.textContent=a.name;let sm=document.createElement('small');sm.textContent=(a.kind==='scene'?'MOTION':a.kind.toUpperCase())+' · '+tc(a.duration);detail.append(sm);b.append(detail);box.append(b);b.onclick=()=>{assetId=a.id;box.querySelectorAll('.binitem').forEach(x=>x.classList.toggle('selected',x===b))};b.ondblclick=()=>append(a);b.ondragstart=e=>e.dataTransfer.setData('text/plain',a.id)}if(project.assets.length){let b=document.createElement('button');b.textContent='Append selected to timeline';b.className='full';b.onclick=()=>{let a=project.assets.find(a=>a.id===assetId);if(a)append(a);else msg('Select a project item first')};box.append(b)}$('import').onclick=()=>$('files').click()}
let thumbs=[];function thumbnail(i){if(!thumbs[i]){let c=document.createElement('canvas');c.width=120;c.height=68;c.getContext('2d').drawImage(scene(i,0),0,0,120,68);thumbs[i]=c.toDataURL()}return thumbs[i]}
function free(track,start,duration,ignore){return !project.clips.some(c=>c.id!==ignore&&c.track===track&&start<c.start+c.duration-.001&&start+duration>c.start+.001)}
function append(a,track=a.kind==='audio'?'A1':'V1',start){if(track.startsWith('A')!==(a.kind==='audio'))return msg('Choose a matching audio or video track');start=start??Math.max(0,...project.clips.filter(c=>c.track===track).map(c=>c.start+c.duration));if(!free(track,start,a.duration))return msg('Drop in an empty part of the track');checkpoint();let c=clip(a.id,track,start,a.duration);project.clips.push(c);sel=c.id;seek(start);render()}
function split(c,when){if(!c||when<=c.start+.01||when>=c.start+c.duration-.01)return msg('Place the playhead inside the clip');checkpoint();let dt=round(when-c.start),n={...c,id:uid(),start:c.start+dt,duration:c.duration-dt,offset:c.offset+dt};c.duration=dt;project.clips.push(n);sel=n.id;render()}
function timeline(){let box=$('timeline');box.innerHTML='';let length=span();for(let tr of ['Time','V2','V1','A1','A2']){let row=document.createElement('div');row.className='line'+(tr==='Time'?' ruler':'');let label=document.createElement('div');label.className='label';label.textContent=tr;row.append(label);let lane=document.createElement('div');lane.className='lane';lane.dataset.track=tr;row.append(lane);box.append(row);let pos=e=>Math.max(0,round((e.clientX-lane.getBoundingClientRect().left)/lane.clientWidth*length));lane.onclick=e=>{if(e.target===lane)seek(pos(e))};if(tr==='Time'){for(let j=0;j<10;j++){let s=document.createElement('span');s.className='tick';s.style.left=j*10+'%';s.textContent=(length*j/10).toFixed(length%10?1:0)+'s';s.style.pointerEvents='none';lane.append(s)}for(let m of project.markers){let f=document.createElement('span');f.style.cssText='position:absolute;bottom:0;color:#edb879;left:'+m/length*100+'%';f.textContent='◆';lane.append(f)}}else{let mute=document.createElement('button');mute.textContent=project.mute[tr]?'Off':'On';mute.title='Toggle track output';mute.onclick=()=>{checkpoint();project.mute[tr]=!project.mute[tr];render()};label.append(mute);lane.ondragover=e=>e.preventDefault();lane.ondrop=e=>{e.preventDefault();let a=project.assets.find(a=>a.id===e.dataTransfer.getData('text/plain'));if(a)append(a,tr,pos(e))};for(let c of project.clips.filter(c=>c.track===tr)){let b=document.createElement('button');b.className='clip '+(tr.startsWith('A')?'a1':tr.toLowerCase())+(sel===c.id?' sel':'');b.style.left=c.start/length*100+'%';b.style.width=c.duration/length*100+'%';b.textContent=nameOf(c);b.title=nameOf(c)+' · drag to move';lane.append(b);b.onpointerdown=e=>{if(exporting)return;e.preventDefault();if(tool==='razor'){split(c,pos(e));return}let x=e.clientX,start=c.start;sel=c.id;inspect();box.querySelectorAll('.clip').forEach(v=>v.classList.toggle('sel',v===b));b.setPointerCapture(e.pointerId);b.onpointermove=ev=>{let d=Math.max(0,round(start
